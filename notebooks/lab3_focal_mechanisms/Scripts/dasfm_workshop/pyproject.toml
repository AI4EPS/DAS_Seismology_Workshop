[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dasfm"
version = "0.1.0"
description = "Focal mechanism inversion from Distributed Acoustic Sensing (DAS) data"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["DAS", "focal mechanism", "seismology", "inversion", "geophysics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "h5py>=3.8",
    "matplotlib>=3.7",
    "pandas>=1.5",
    "tqdm>=4.64",
    "psutil>=5.9",
    "obspy>=1.4",
    "rasterio>=1.3",
    "numba>=0.57",
    "ipykernel>=6.0",
    "ipywidgets>=8.0",
    "huggingface_hub>=0.20",
]

[project.optional-dependencies]
3d = ["pykonal>=0.3"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "sphinx>=7.0",
    "numpydoc>=1.6",
    "sphinx-rtd-theme>=1.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dasfm*"]